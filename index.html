<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    <p> This is a rock paper scissors game</p>

    <h2>Game Controls</h2>
    
    <!-- Player selection options -->
     <ul id="playerOptions"> 
        <li><button id="rock">Rock</button></li>
        <li><button id="paper">Paper</button></li>
        <li><button id="scissors">Scissors</button></li>
     </ul>
        

    <!-- Display the results of RPS -->
    <!-- Winner of round + current score --> 
    <div id="displayResults">
        <p>These are the results of RPS</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
